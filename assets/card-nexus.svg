  <text x="28" y="78" class="sans" font-size="13" fill="#9AA7B6">AI freelance opportunity discovery and proposal assistant.</text><text x="28" y="98" class="sans" font-size="13" fill="#9AA7B6">Analyzes projects against a verified profile and drafts</text><text x="28" y="118" class="sans" font-size="13" fill="#9AA7B6">Persian proposals, with human approval at every step.</text>
