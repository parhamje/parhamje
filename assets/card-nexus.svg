    <radialGradient id="glow" cx="1" cy="0" r="0.8"><stop offset="0" stop-color="#6EE7B7" stop-opacity="0.18"/><stop offset="1" stop-color="#6EE7B7" stop-opacity="0"/></radialGradient>
