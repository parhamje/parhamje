<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Parham Jenani, AI and Automation Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#131B26"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6DE9B"/>
      <stop offset="0.55" stop-color="#D6A74A"/>
      <stop offset="1" stop-color="#B8832B"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6A74A" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#D6A74A" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#6EE7B7" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#D6A74A" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#D6A74A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMint" cx="0.05" cy="1" r="0.55">
      <stop offset="0" stop-color="#6EE7B7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6EE7B7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" opacity="0.07"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="340" rx="20"/></clipPath>
    <path id="p1" d="M740,213 C770,213 765,143 795,143"/>
    <path id="p2" d="M895,143 C925,143 920,213 950,213"/>
    <path id="p3" d="M1050,213 C1080,213 1075,133 1105,133"/>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace; }
    .sans { font-family: 'Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif; }
    .rise { animation: rise 0.9s ease-out backwards; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; }
    .d3 { animation-delay: .55s; } .d4 { animation-delay: .75s; } .d5 { animation-delay: .95s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .flow { stroke-dasharray: 6 8; animation: dash 1.4s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    .pulse { animation: pulse 3.6s ease-in-out infinite; transform-origin: 1000px 120px; }
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .float { animation: float 5s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect width="1200" height="340" fill="url(#glowGold)" class="pulse"/>
    <rect width="1200" height="340" fill="url(#glowMint)"/>

    <!-- window dots -->
    <circle cx="44" cy="38" r="5.5" fill="#FF5F57" opacity="0.85"/>
    <circle cx="64" cy="38" r="5.5" fill="#FEBC2E" opacity="0.85"/>
    <circle cx="84" cy="38" r="5.5" fill="#28C840" opacity="0.85"/>

    <!-- text -->
    <g class="rise d1">
      <text x="60" y="92" class="mono" font-size="15" fill="#6EE7B7">&lt;hello_world /&gt;</text>
    </g>
    <g class="rise d2">
      <text x="58" y="158" class="sans" font-size="66" font-weight="800" fill="url(#gold)" letter-spacing="1">Parham Jenani</text>
    </g>
    <g class="rise d3">
      <text x="60" y="203" class="sans" font-size="27" font-weight="500" fill="#E7EDF3">AI &amp; Automation Engineer</text>
    </g>
    <g class="rise d4">
      <text x="60" y="236" class="mono" font-size="14.5" fill="#8B98A8">RAG systems  ·  AI agents  ·  n8n workflows  ·  React</text>
    </g>
    <g class="rise d5">
      <g class="mono" font-size="13" text-anchor="middle">
        <rect x="60" y="262" width="82" height="30" rx="15" fill="#D6A74A" fill-opacity="0.08" stroke="#D6A74A" stroke-opacity="0.55"/>
        <text x="101" y="282" fill="#F0D590">Python</text>
        <rect x="152" y="262" width="62" height="30" rx="15" fill="#D6A74A" fill-opacity="0.08" stroke="#D6A74A" stroke-opacity="0.55"/>
        <text x="183" y="282" fill="#F0D590">n8n</text>
        <rect x="224" y="262" width="62" height="30" rx="15" fill="#D6A74A" fill-opacity="0.08" stroke="#D6A74A" stroke-opacity="0.55"/>
        <text x="255" y="282" fill="#F0D590">RAG</text>
        <rect x="296" y="262" width="76" height="30" rx="15" fill="#6EE7B7" fill-opacity="0.07" stroke="#6EE7B7" stroke-opacity="0.5"/>
        <text x="334" y="282" fill="#A7F3D0">React</text>
        <rect x="382" y="262" width="118" height="30" rx="15" fill="#6EE7B7" fill-opacity="0.07" stroke="#6EE7B7" stroke-opacity="0.5"/>
        <text x="441" y="282" fill="#A7F3D0">Open to work</text>
      </g>
    </g>

    <!-- workflow graph -->
    <g class="float">
      <g fill="none" stroke-width="2" stroke-linecap="round">
        <use href="#p1" stroke="#D6A74A" stroke-opacity="0.8" class="flow"/>
        <use href="#p2" stroke="#6EE7B7" stroke-opacity="0.8" class="flow"/>
        <use href="#p3" stroke="#D6A74A" stroke-opacity="0.8" class="flow"/>
      </g>

      <circle r="4" fill="#F6DE9B"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
      <circle r="4" fill="#A7F3D0"><animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
      <circle r="4" fill="#F6DE9B"><animateMotion dur="2.6s" begin="1.8s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>

      <g class="mono" font-size="12.5" fill="#E7EDF3">
        <rect x="640" y="190" width="100" height="46" rx="12" fill="#161F2B" stroke="url(#edge)" stroke-width="1.4"/>
        <circle cx="660" cy="213" r="5" fill="#D6A74A"/>
        <text x="672" y="217.5">Webhook</text>

        <rect x="795" y="120" width="100" height="46" rx="12" fill="#161F2B" stroke="url(#edge)" stroke-width="1.4"/>
        <circle cx="815" cy="143" r="5" fill="#6EE7B7"/>
        <text x="827" y="147.5">RAG</text>

        <rect x="950" y="190" width="100" height="46" rx="12" fill="#161F2B" stroke="url(#edge)" stroke-width="1.4"/>
        <circle cx="970" cy="213" r="5" fill="#D6A74A"/>
        <text x="982" y="217.5">AI Agent</text>

        <rect x="1105" y="110" width="76" height="46" rx="12" fill="#161F2B" stroke="url(#edge)" stroke-width="1.4"/>
        <circle cx="1124" cy="133" r="5" fill="#6EE7B7"/>
        <text x="1135" y="137.5" font-size="11.5">Bot</text>
      </g>
    </g>

    <!-- border -->
    <rect x="1" y="1" width="1198" height="338" rx="19" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  </g>
</svg>
